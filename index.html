const CLASSIFY = {
 plate: c => /[A-Z]/.test(c) ? "A" : /[0-9]/.test(c) ? "D" : "O",
 mobile: c => c === "+" ? "PLUS" : c === "0" ? "ZERO" : c === "1" ? "ONE" : c === "9" ? "NINE" :
              /[678]/.test(c) ? "HI" : /[2-5]/.test(c) ? "MID" : "O",
 date: c => /[0-9\/]/.test(c) ? c : "other"
};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const sel = document.getElementById("app"), inp = document.getElementById("inp");
for (const k in A) sel.add(new Option(A[k].title, k));
function run(){
 const k = sel.value, d = A[k], s = inp.value;
 let st = d.start; const rows = [], visited = new Set([st]);
 [...s].forEach((ch, i) => {
   const sym = CLASSIFY[k](ch);
   const nx = d.alphabet.includes(sym) ? (d.delta[st + "|" + sym] || "trap") : "trap";
   rows.push(`<tr><td>${i+1}</td><td>${st}</td><td>${ch === " " ? "&#9251;" : esc(ch)}</td><td>${sym}</td><td>${nx}</td></tr>`);
   st = nx; visited.add(st);
 });
 const ok = d.accepting.includes(st);
 const v = document.getElementById("verdict");
 v.className = "verdict " + (ok ? "ok" : "bad");
 v.textContent = (ok ? "ACCEPTED" : "REJECTED") + " - final state " + st;
 document.getElementById("trace").innerHTML = rows.join("");
 document.querySelectorAll("#diagram g.node").forEach(g => {
   const t = g.querySelector("title").textContent;
   g.classList.toggle("cur", t === st);
   g.classList.toggle("visited", visited.has(t) && t !== st);
 });
}
function load(){
 const k = sel.value, d = A[k];
 document.getElementById("diagram").innerHTML = SVG[k] ||
   "";
 const chip = (x, c) => `<span class="${c}" data-v="${esc(x)}">${x === "" ? "(empty)" : esc(x)}</span>`;
 document.getElementById("chips").innerHTML =
   d.examples.accept.map(x => chip(x, "a")).join("") + d.examples.reject.map(x => chip(x, "r")).join("");
 document.querySelectorAll("#chips span").forEach(sp => sp.onclick = () => { inp.value = sp.dataset.v; run(); });
 document.getElementById("info").textContent =
   d.name + " - " + d.states + " states incl. trap; alphabet {" + d.alphabet.join(", ") + "}";
 inp.value = d.examples.accept[0]; run();
}
sel.onchange = load; inp.oninput = run;
const h = new URLSearchParams(location.hash.slice(1));
if (h.get("app") && A[h.get("app")]) sel.value = h.get("app");
load();
if (h.has("s")) { inp.value = h.get("s"); run(); }
